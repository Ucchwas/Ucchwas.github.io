# Site settings. Content lives in _data/*.yml; this file only holds site-wide metadata.
title: Ucchwas Talukder Utsha
# Default search-result and link-preview text (the home page and any page without its own).
description: >-
  Ucchwas Talukder Utsha is a Postdoctoral Scholar at Stanford University building LLM-reasoning,
  graph-learning, and foundation-model systems for biomedicine.
url: "https://ucchwas.github.io"
baseurl: ""
lang: en
timezone: America/Los_Angeles

# GitHub Pages would otherwise inject the Primer theme.
theme: null

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

# Always-on GitHub Pages plugins that this site does not want.
redirect_from:
  json: false
optional_front_matter:
  enabled: false
readme_index:
  enabled: false
titles_from_headings:
  enabled: false

# Setting `exclude` replaces Jekyll's default list, so the defaults are repeated here.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - Ucchwas_Resume.pdf
