- name: Defending ECG classifiers against boundary attacks
  image: /assets/img/projects/boundary-attack.svg
  period: "2025"
  where: Texas Tech
  summary: >-
    Black-box boundary attacks on a 1D-CNN arrhythmia classifier, with adversarial retraining and
    low-pass filtering as defenses.
  metric: "After adversarial retraining: 11.39% attack success on unseen adversarial signals, 94.57% clean accuracy"
  tags: [TensorFlow, Adversarial ML]
  links:
    - { label: Paper, url: "https://doi.org/10.1109/SATC65530.2025.11136979" }
